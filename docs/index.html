<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스 상태</title>
<style>
:root { --bg:#f6f6f3; --card:#fff; --ink:#111; --muted:#6b6b6b; --line:#ebebe7; --ok:#1f9d55; --bad:#e5484d; --rec:#f0a020; --none:#ececE8; }
@media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1b1b1b; --ink:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --ok:#2fb86a; --bad:#ff5d61; --rec:#f5b43c; --none:#2b2b2b; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
main { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
h1 { font-size:26px; margin:0 0 4px; font-weight:800; letter-spacing:-0.02em; }
.sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
.banner { padding:12px 16px; border-radius:10px; font-weight:700; font-size:16px; margin-bottom:8px; color:#fff; }
.banner.ok { background:var(--ok); } .banner.bad { background:var(--bad); }
h2 { font-size:17px; color:var(--ink); margin:28px 0 10px; font-weight:700; letter-spacing:-0.01em; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
.row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.dot { width:10px; height:10px; border-radius:50%; flex:none; }
.name { flex:1; min-width:0; font-weight:600; }
.tech { color:var(--muted); font-weight:400; font-size:13px; margin-left:6px; white-space:nowrap; }
.bars { display:flex; gap:2px; flex:none; }
.bar { width:5px; height:20px; border-radius:2px; background:var(--none); }
.ok { background:var(--ok); } .bad { background:var(--bad); } .recovered { background:var(--rec); }
.inc { padding:14px; }
.inc + .inc { border-top:1px solid var(--line); }
.inc-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.inc-title { font-weight:700; }
.inc-when { color:var(--muted); font-size:13px; white-space:nowrap; }
.inc dl { display:grid; grid-template-columns:72px 1fr; gap:4px 12px; margin:10px 0 0; font-size:14px; }
.inc dt { color:var(--muted); }
.inc dd { margin:0; }
.empty { color:var(--muted); padding:14px; font-size:14px; }
.legend { color:var(--muted); font-size:12px; margin-top:20px; }
@media (max-width:520px) { .bar { width:3px; } }
</style>
</head>
<body>
<main>
  <h1>서비스 상태</h1>
  <p class="sub" id="sub">불러오는 중…</p>
  <div id="banner"></div>
  <div id="groups"></div>
  <p class="legend">매일 09:00(KST) 자동 점검 · 막대는 최근 30일(오른쪽이 최신) · 주황은 고장 후 같은 날 복구, 회색은 기록 없음</p>
  <h2>장애 기록</h2>
  <div class="card" id="incidents"><p class="empty">불러오는 중…</p></div>
</main>
<script type="module">
import { barState, durationText } from "./status.mjs";

const load = (f) => fetch(f, { cache: "no-store" }).then((r) => r.json());
const kst = (t) => new Date(t).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const incidents = await load("incidents.json").catch(() => []);

/** 장애 기록: 최신이 위. 영향·원인·조치·재발 방지 */
const incRoot = document.getElementById("incidents");
incRoot.replaceChildren();
if (!incidents.length) incRoot.append(Object.assign(document.createElement("p"), { className: "empty", textContent: "기록된 장애가 없습니다." }));
for (const i of incidents) {
  const box = Object.assign(document.createElement("div"), { className: "inc" });
  const head = Object.assign(document.createElement("div"), { className: "inc-head" });
  head.append(
    Object.assign(document.createElement("span"), { className: "inc-title", textContent: `${i.date} · ${i.title}` }),
    Object.assign(document.createElement("span"), { className: "inc-when", textContent: `감지 ${kst(i.detected)} → 복구 ${kst(i.resolved)} (${durationText(i.detected, i.resolved)})` }),
  );
  const dl = document.createElement("dl");
  for (const [k, v] of [["영향", i.impact], ["원인", i.cause], ["조치", i.fix], ["재발 방지", i.prevention], ["시작 범위", i.lastOk && `마지막 정상 점검 ${kst(i.lastOk)} 이후`]]) {
    if (!v) continue;
    dl.append(Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v }));
  }
  box.append(head, dl);
  incRoot.append(box);
}

load("history.json").then(history => {
  const sub = document.getElementById("sub");
  if (!history.length) { sub.textContent = "아직 기록이 없습니다."; return; }
  const latest = history[0];
  const down = latest.checks.filter(c => !c.ok).length;
  sub.textContent = `마지막 점검: ${latest.date}`;
  const banner = document.getElementById("banner");
  banner.className = "banner " + (down ? "bad" : "ok");
  banner.textContent = down ? `고장 ${down}개` : "모두 정상";

  const days = [...history].reverse(); // 왼쪽이 오래된 날
  const groups = {};
  for (const c of latest.checks) {
    const [service, part] = c.name.split(" · ");
    (groups[service] ??= []).push({ name: part ?? c.name, full: c.name, ok: c.ok });
  }
  const root = document.getElementById("groups");
  for (const [service, items] of Object.entries(groups)) {
    const h = document.createElement("h2"); h.textContent = service; root.append(h);
    const card = document.createElement("div"); card.className = "card";
    for (const it of items) {
      const row = document.createElement("div"); row.className = "row";
      const dot = document.createElement("span"); dot.className = "dot " + (it.ok ? "ok" : "bad");
      const name = document.createElement("span"); name.className = "name";
      const m = it.name.match(/^(.*?)\s*\((.+)\)$/); // "검색 (DB·Hugging Face)" → 이름 + 기술
      name.textContent = m ? m[1] : it.name;
      if (m) name.append(Object.assign(document.createElement("span"), { className: "tech", textContent: m[2] }));
      const bars = document.createElement("span"); bars.className = "bars";
      for (let i = 0; i < 30 - days.length; i++) bars.append(Object.assign(document.createElement("span"), { className: "bar" }));
      for (const d of days) {
        const state = barState(d, it.full, incidents);
        const b = document.createElement("span");
        b.className = "bar" + (state === "none" ? "" : " " + state);
        b.title = `${d.date} ${{ ok: "정상", bad: "고장", recovered: "고장 후 복구", none: "기록 없음" }[state]}`;
        bars.append(b);
      }
      row.append(dot, name, bars); card.append(row);
    }
    root.append(card);
  }
}).catch(() => { document.getElementById("sub").textContent = "기록을 불러오지 못했습니다."; });
</script>
</body>
</html>
